# Java Gradle 自动编译并发布 Release

name: Java CI with Gradle


on:

  # 所有分支提交自动编译
  push:
    branches:
      - "**"

  # PR 检查
  pull_request:

  # 手动运行
  workflow_dispatch:



# 防止同一个分支重复运行
concurrency:

  group: ${{ github.workflow }}-${{ github.ref }}

  cancel-in-progress: true



jobs:

  build:


    runs-on: ubuntu-latest


    permissions:

      contents: write



    steps:


    # 拉取源码
    - name: 检出代码

      uses: actions/checkout@v4



    # JDK 21

    - name: 配置 JDK 21

      uses: actions/setup-java@v5

      with:

        java-version: '21'

        distribution: 'temurin'



    # Gradle 缓存

    - name: 配置 Gradle

      uses: gradle/actions/setup-gradle@v4



    # 编译

    - name: Gradle 编译

      run: ./gradlew jar



    # 获取 jar

    - name: 获取 jar 文件

      id: jar

      run: |

        path="$(ls LunaGC-*.jar | head -n 1)"

        echo "path=$path" >> "$GITHUB_OUTPUT"

        echo "name=$(basename "$path" .jar)" >> "$GITHUB_OUTPUT"



    # 上传 Artifact

    - name: 上传编译文件

      uses: actions/upload-artifact@v4

      with:

        name: ${{ steps.jar.outputs.name }}

        path: ${{ steps.jar.outputs.path }}

        if-no-files-found: error



    # 自动发布 Release

    - name: 发布最新 Release

      if: github.event_name == 'push'

      env:

        GH_TOKEN: ${{ github.token }}

        JAR_PATH: ${{ steps.jar.outputs.path }}

        JAR_NAME: ${{ steps.jar.outputs.name }}

        REPO: ${{ github.repository }}

        BRANCH: ${{ github.ref_name }}

        SHA: ${{ github.sha }}


      run: |


        echo "生成 Release 说明"


        cat > release-notes.md <<EOF
自动云编译版本


分支:

$BRANCH


Commit:

$SHA


下载:

https://github.com/$REPO/releases/latest/download/$JAR_NAME.jar


资源文件不会打包，请将 resources 文件夹放在 jar 同目录。
EOF



        echo "删除旧 Release"


        gh release delete latest --yes --cleanup-tag || true



        echo "创建新 Release"


        gh release create latest "$JAR_PATH" --title "$JAR_NAME (最新编译版本)" --notes-file release-notes.md --latest
