name: Build and Release

permissions:
  contents: write

on:
  push:
    branches:
      - "7.0.0"
    tags:
      - '*'

  pull_request:
    branches:
      - "7.0.0"

  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如：7.0.0）'
        required: true
        default: '7.0.0'
        type: string

      release:
        description: '是否发布 Release'
        required: true
        default: false
        type: boolean


jobs:
  build:

    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.set_version.outputs.version }}
      release: ${{ steps.set_version.outputs.release }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin


      - name: Make gradlew executable
        run: chmod +x gradlew


      - name: Get version and release flag
        id: set_version
        shell: bash
        run: |

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            VERSION="${{ inputs.version }}"
            RELEASE="${{ inputs.release }}"


          elif [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then

            VERSION="${GITHUB_REF#refs/tags/}"
            RELEASE="true"


          else

            VERSION=$(grep "^version =" build.gradle | sed "s/version = '\(.*\)'/\1/")
            RELEASE="false"

          fi


          if [ -z "$VERSION" ]; then
            VERSION="7.0.0"
            echo "Warning: version missing, using 7.0.0"
          fi


          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "release=$RELEASE" >> $GITHUB_OUTPUT


          echo "=========================="
          echo "Version : $VERSION"
          echo "Release : $RELEASE"
          echo "=========================="


      - name: Update build.gradle version
        run: |
          sed -i "s/version = '.*'/version = '${{ steps.set_version.outputs.version }}'/" build.gradle


      - name: Create proto folder
        run: |
          mkdir -p proto
          touch proto/.gitkeep


      - name: Build with Gradle
        run: |
          ./gradlew injectGitHash jar -x generateProto -PskipHandbook=1 --no-daemon


      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LunaGC-${{ steps.set_version.outputs.version }}
          path: |
            LunaGC-*.jar
          if-no-files-found: error


      - name: Create GitHub Release
        if: steps.set_version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2

        with:

          tag_name: ${{ steps.set_version.outputs.version }}

          name: LunaGC ${{ steps.set_version.outputs.version }}

          body: |
            自动云编译版本

            Version:
            ${{ steps.set_version.outputs.version }}

            Commit:
            ${{ github.sha }}

          files: |
            LunaGC-*.jar

          generate_release_notes: true


        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
