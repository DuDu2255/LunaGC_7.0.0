# 此工作流使用 GitHub Actions 自动编译 Java Gradle 项目
# 支持依赖缓存，提高编译速度
# 更多信息:
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle


on:

  # 监听所有分支提交
  # 不限制版本分支，避免版本升级后工作流失效
  push:
    branches:
      - "**"

  # Pull Request 自动检查
  pull_request:


  # 手动运行
  workflow_dispatch:



# 防止同一个分支重复编译
concurrency:

  group: ${{ github.workflow }}-${{ github.ref }}

  cancel-in-progress: true



jobs:

  build:


    runs-on: ubuntu-latest


    permissions:

      # 用于创建 Release
      contents: write



    steps:


    # 拉取源码
    - name: 检出代码
      uses: actions/checkout@v4



    # 安装 Java 21 环境
    - name: 配置 JDK 21

      uses: actions/setup-java@v5

      with:

        java-version: '21'

        distribution: 'temurin'



    # 配置 Gradle 环境
    # 自动缓存 Gradle 依赖，提高编译速度
    - name: 配置 Gradle

      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582



    # 使用 Gradle Wrapper 编译

    - name: Gradle 编译

      run: ./gradlew jar



    # 查找生成的 jar 文件

    # LunaGC jar 格式:
    # LunaGC-版本号.jar

    - name: 获取 jar 文件信息

      id: jar

      run: |

        path="$(ls LunaGC-*.jar | head -n 1)"

        echo "path=$path" >> "$GITHUB_OUTPUT"

        echo "name=$(basename "$path" .jar)" >> "$GITHUB_OUTPUT"



    # 保存编译产物

    # GitHub Artifact 默认保存 90 天

    - name: 上传编译文件

      uses: actions/upload-artifact@v4

      with:

        name: ${{ steps.jar.outputs.name }}

        path: ${{ steps.jar.outputs.path }}

        if-no-files-found: error



    # 自动发布 Release

    # 生成永久下载地址:
    # https://github.com/用户/仓库/releases/latest/download/文件名.jar

    - name: 发布最新 Release

      if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch


      env:

        GH_TOKEN: ${{ github.token }}

        JAR_PATH: ${{ steps.jar.outputs.path }}

        JAR_NAME: ${{ steps.jar.outputs.name }}

        REPO: ${{ github.repository }}

        BRANCH: ${{ github.ref_name }}

        SHA: ${{ github.sha }}



      run: |


        # 创建 Release 说明文件

        cat > release-notes.md <<EOF

        自动云编译版本


        分支:

        \$BRANCH


        Commit:

        \$SHA


        下载:

        https://github.com/\$REPO/releases/latest/download/\$JAR_NAME.jar


        资源文件不会打包，请运行前将 resources 文件夹放在 jar 同目录。

        EOF



        # 删除旧 Release

        gh release delete latest --yes --cleanup-tag || true



        # 创建新的 Release

        gh release create latest "$JAR_PATH" \

          --title "$JAR_NAME (最新编译版本)" \

          --notes-file release-notes.md \

          --latest



# 如果需要启用依赖安全扫描：
#
# 需要在:
# 仓库 Settings
# → Advanced Security
# → 开启 Dependency graph
#
# 然后取消下面注释:
#
# - name: 生成并提交依赖关系图
