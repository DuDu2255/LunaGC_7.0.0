name: Java CI with Gradle

on:

  push:
    branches:
      - "**"

  pull_request:

  workflow_dispatch:


concurrency:

  group: ${{ github.workflow }}-${{ github.ref }}

  cancel-in-progress: true



jobs:

  build:

    runs-on: ubuntu-latest

    permissions:
      contents: write


    steps:


      - name: 检出代码
        uses: actions/checkout@v4



      - name: 配置 JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'



      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4



      - name: Gradle 编译
        run: ./gradlew jar



      - name: 获取 jar 文件
        id: jar
        shell: bash
        run: |

          path="$(ls LunaGC-*.jar | head -n 1)"

          echo "path=$path" >> "$GITHUB_OUTPUT"

          echo "name=$(basename "$path" .jar)" >> "$GITHUB_OUTPUT"



      - name: 上传编译文件
        uses: actions/upload-artifact@v4
        with:

          name: ${{ steps.jar.outputs.name }}

          path: ${{ steps.jar.outputs.path }}

          if-no-files-found: error



      - name: 发布最新 Release

        if: github.event_name == 'push'

        env:

          GH_TOKEN: ${{ github.token }}

          JAR_PATH: ${{ steps.jar.outputs.path }}

          JAR_NAME: ${{ steps.jar.outputs.name }}

          REPO: ${{ github.repository }}

          BRANCH: ${{ github.ref_name }}

          SHA: ${{ github.sha }}


        run: |


          echo "生成 Release 说明"


          cat > release-notes.md <<EOF
自动云编译版本

分支:
$BRANCH

Commit:
$SHA

下载:
https://github.com/$REPO/releases/latest/download/$JAR_NAME.jar

资源文件不会打包，请将 resources 文件夹放在 jar 同目录。
EOF



          echo "删除旧 Release"


          gh release delete latest --yes --cleanup-tag || true



          echo "创建新 Release"


          gh release create latest "$JAR_PATH" --title "$JAR_NAME (最新编译版本)" --notes-file release-notes.md --latest
